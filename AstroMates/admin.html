<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Privado - AstroMates</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .login-box {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        input[type="password"] {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            flex-grow: 1;
        }
        button, .btn-download {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .btn-download:hover { background: #0369a1; }
        .comment-card {
            background: #1e293b;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #38bdf8;
        }
        .comment-meta {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .comment-author { color: #f35626; font-weight: bold; }
        .comment-text { color: #e2e8f0; margin: 0; white-space: pre-wrap; }
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>🔒 Panel de Administración - Comentarios AstroMates</h1>

    <div class="login-box">
        <input type="password" id="adminPass" placeholder="Introduce tu clave secreta de admin">
        <button onclick="cargarComentariosAdmin()">Acceder</button>
    </div>

    <div id="contentArea" style="display: none;">
        <div class="actions-bar">
            <h2>Comentarios Recibidos (<span id="totalCount">0</span>)</h2>
            <a id="downloadBtn" href="#" class="btn-download" target="_blank">📥 Exportar a CSV / Excel</a>
        </div>
        <div id="commentsList"></div>
    </div>

    <script>
        async function cargarComentariosAdmin() {
            const pass = document.getElementById("adminPass").value;
            const contentArea = document.getElementById("contentArea");
            const commentsList = document.getElementById("commentsList");

            try {
                const res = await fetch("/api/admin/comentarios", {
                    headers: { "x-admin-password": pass }
                });

                if (!res.ok) {
                    alert("⚠️ Contraseña incorrecta u error de autenticación.");
                    return;
                }

                const comentarios = await res.json();
                
                document.getElementById("totalCount").textContent = comentarios.length;
                document.getElementById("downloadBtn").href = `/api/admin/exportar?pass=${encodeURIComponent(pass)}`;
                contentArea.style.display = "block";

                if (comentarios.length === 0) {
                    commentsList.innerHTML = "<p>No hay comentarios aún.</p>";
                    return;
                }

                commentsList.innerHTML = comentarios.map(c => `
                    <div class="comment-card">
                        <div class="comment-meta">
                            <span>ID #${c.id} - Autor: <span class="comment-author">${escapeHtml(c.nombre)}</span></span>
                            <span>${new Date(c.fecha).toLocaleString()}</span>
                        </div>
                        <p class="comment-text">${escapeHtml(c.texto)}</p>
                    </div>
                `).join("");

            } catch (error) {
                console.error(error);
                alert("Error de conexión con el servidor.");
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[m]);
        }
    </script>
    <script src="server.js"></script>
</body>
</html>
